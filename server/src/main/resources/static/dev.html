<!doctype html>
<!-- DEV ONLY: a throwaway page for trying the WebSocket protocol by hand. The React client
     replaces it. Open two windows at http://localhost:8080/dev.html with different names. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat dev page</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 16px auto; padding: 0 16px; }
  fieldset { margin-bottom: 12px; }
  input { margin-right: 6px; }
  #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; font-family: monospace; white-space: pre-wrap; }
  .in { color: #0a5; } .out { color: #06c; } .err { color: #c00; } .sys { color: #888; }
</style>
</head>
<body>
<h1>Chat dev page</h1>

<fieldset>
  <legend>Connection</legend>
  <input id="user" placeholder="your username" autofocus>
  <button id="connect">Connect</button>
  <span id="status" class="sys">disconnected</span>
</fieldset>

<fieldset>
  <legend>Send</legend>
  <input id="to" placeholder="to (username)">
  <input id="text" placeholder="message" size="30">
  <button id="send" disabled>Send</button>
</fieldset>

<div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let ws = null;

  function log(cls, line) {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = new Date().toLocaleTimeString() + '  ' + line;
    $('log').appendChild(div);
    $('log').scrollTop = $('log').scrollHeight;
  }

  $('connect').onclick = () => {
    if (ws) { ws.close(1000, 'bye'); return; }
    const user = $('user').value.trim();
    // Same host as the page, WebSocket port 8081 unless the page URL has ?wsPort=... (for a second
    // instance on other ports). ?user= is the dev-only identity; Phase 7 uses a cookie.
    const wsPort = new URLSearchParams(location.search).get('wsPort') || '8081';
    ws = new WebSocket(`ws://${location.hostname}:${wsPort}/?user=${encodeURIComponent(user)}`);
    $('status').textContent = 'connecting…';

    ws.onopen = () => {
      $('status').textContent = 'connected as ' + user;
      $('connect').textContent = 'Disconnect';
      $('send').disabled = false;
      log('sys', 'connected as ' + user);
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'message') {
        // A message we sent from another tab arrives with from === us.
        const arrow = m.from === user ? `(other tab) you → ${m.to}` : `${m.from} → you`;
        log('in', `${arrow}: ${m.text}`);
      } else if (m.type === 'ack') {
        log('sys', `ack ${m.clientMsgId.slice(0, 8)} → id ${m.id.slice(0, 8)}`);
      } else if (m.type === 'error') {
        log('err', `error ${m.code}: ${m.message}`);
      } else {
        log('sys', 'unknown: ' + e.data);
      }
    };
    ws.onclose = (e) => {
      log('sys', `closed (code ${e.code}${e.reason ? ', ' + e.reason : ''})`);
      $('status').textContent = 'disconnected';
      $('connect').textContent = 'Connect';
      $('send').disabled = true;
      ws = null;
    };
  };

  function send() {
    const text = $('text').value;
    const msg = { type: 'send', to: $('to').value.trim(), clientMsgId: crypto.randomUUID(), text };
    ws.send(JSON.stringify(msg));
    log('out', `you → ${msg.to}: ${text}`);
    $('text').value = '';
  }
  $('send').onclick = send;
  $('text').onkeydown = (e) => { if (e.key === 'Enter' && !$('send').disabled) send(); };
</script>
</body>
</html>
