spring.application.name=chat-server

spring.datasource.url=jdbc:postgresql://localhost:5432/chat
spring.datasource.username=chat
spring.datasource.password=chat
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.threads.virtual.enabled=true
# The pool, not the thread count, caps concurrent database work: thousands of virtual threads
# can be waiting, but only this many hold a connection. Postgres pays for every connection
# (a process each), so more isn't free. Fail fast when the pool is exhausted: the client gets a
# server_error and retries with the same clientMsgId, rather than stalling for Hikari's default 30s.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

chat.ws.port=8081
chat.ws.ping-after-idle=30s
chat.ws.pong-timeout=10s
chat.ws.write-timeout=10s
chat.ws.sweep-interval=10s
chat.ws.shutdown-grace=2s
# On SIGTERM Spring first drains in-flight REST requests (graceful shutdown), then destroys beans,
# which is when WsServer sends 1001 and waits shutdown-grace for the replies. The drain defaults to
# up to 30s; capped here so drain + WS close (~12s worst case) fits inside the container's
# stop_grace_period (30s in docker-compose.yml) and the 1001 goes out before any SIGKILL.
spring.lifecycle.timeout-per-shutdown-phase=10s
# Tabs/devices per account: the real connection limit.
chat.ws.max-connections-per-user=5
# Per client IP, only a flood guard (NAT and offices put many users behind one IP). Behind a
# reverse proxy the IP comes from X-Forwarded-For, believed only from chat.auth.trusted-proxies.
chat.ws.max-connections-per-ip=100
# Frames queued per connection before a client counts as too slow and is closed with 1008.
chat.ws.send-queue-capacity=256

chat.auth.session-ttl=7d
# Must be true in production (HTTPS). False here only because local dev is plain http.
chat.auth.cookie-secure=false
# Exact origins allowed to make state-changing REST calls and to open WebSockets (CSRF / CSWSH).
# :5173 is the Vite dev server. Its /api proxy forwards the browser's Origin unchanged, and the
# WebSocket goes straight from that page to :8081, so both checks see http://localhost:5173.
# The session cookie still reaches :8081: cookies are scoped by host, not port (RFC 6265 §8.5),
# and the cookie was set on localhost via the proxied login response.
chat.auth.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
chat.auth.bcrypt-cost=12
chat.auth.login-max-failures-per-user=5
chat.auth.login-max-failures-per-ip=50
chat.auth.login-window=15m
# Proxies whose X-Forwarded-For is believed (IPs or CIDRs). None when running without a proxy, as
# here: the header would be client-controlled. docker-compose.yml sets nginx's address.
chat.auth.trusted-proxies=

# Heartbeat activity (pings, pongs, dead peers, stuck writes). No message content is logged at
# any level.
logging.level.com.sithija.chat.ws.heartbeat=DEBUG
