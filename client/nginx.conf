# One origin for everything (http://localhost:3000): the SPA, REST under /api/ and the WebSocket
# under /ws. Same-origin means no CORS, and the session cookie set by /api/auth/login is sent on the
# /ws upgrade as well, which is how the socket is authenticated.

# Docker's embedded DNS. With a variable in proxy_pass, nginx resolves "server" per request (cached
# for `valid`) instead of once at startup. A startup-only lookup would pin the old container IP
# after the server container is recreated (`up --build`), giving 502s until nginx restarts, and
# would stop nginx starting at all if the server were down at that moment.
resolver 127.0.0.11 valid=10s ipv6=off;

# Connection: upgrade only when the client is actually upgrading; otherwise "close", so a plain
# request to /ws isn't mistaken for a keep-alive upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The real client for the server's per-IP limits. X-Forwarded-For appends $remote_addr (the
    # peer nginx sees) to whatever the client sent; the server trusts it only because the request
    # comes from this container's fixed address (chat.auth.trusted-proxies), and reads it from the
    # right, so a forged prefix is ignored. X-Real-IP is the same address, for tooling and logs.
    #
    # Repeated in each location on purpose: proxy_set_header is inherited from the server block only
    # by locations that set none of their own, and /ws must set Upgrade/Connection. Declared once up
    # here, /ws would silently lose X-Forwarded-For and every socket would count as nginx's IP.
    location /api/ {
        set $api_backend server:8080;
        proxy_pass http://$api_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location = /ws {
        set $ws_backend server:8081;
        proxy_pass http://$ws_backend;

        # The upgrade is hop-by-hop: nginx drops Upgrade/Connection unless they're set again
        # explicitly, and WebSocket upgrades need HTTP/1.1 (nginx speaks 1.0 upstream by default).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # Frames must reach the other side as they arrive, not when a buffer fills.
        proxy_buffering off;

        # nginx closes a proxied connection when the server has sent nothing for proxy_read_timeout
        # (default 60s). An idle chat sends nothing but heartbeats, and ours only starts pinging
        # after 30s of silence and checks every 10s, so a ping can be up to ~40s apart; one late
        # sweep or GC pause and a quiet but healthy chat is cut at 60s, every minute. 120s leaves
        # a 3x margin; genuinely dead peers are still found by the server's own heartbeat.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Built assets have content hashes in their names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: any other path is a client-side route, so fall back to index.html. index.html itself
    # is never cached, so a new deploy's asset names are picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
