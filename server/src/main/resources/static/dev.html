<!doctype html>
<!-- DEV ONLY: a throwaway page for trying the WebSocket protocol by hand. The React client
     replaces it. The session cookie is shared by every window of one browser profile, so to
     chat as two users use a normal window plus a private/incognito one (or two browsers). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat dev page</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 16px auto; padding: 0 16px; }
  fieldset { margin-bottom: 12px; }
  input { margin-right: 6px; }
  #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; font-family: monospace; white-space: pre-wrap; }
  .in { color: #0a5; } .out { color: #06c; } .err { color: #c00; } .sys { color: #888; }
</style>
</head>
<body>
<h1>Chat dev page</h1>

<fieldset>
  <legend>Account</legend>
  <input id="user" placeholder="username" autocomplete="username" autofocus>
  <input id="password" type="password" placeholder="password (8+ chars)" autocomplete="current-password">
  <button id="register">Register</button>
  <button id="login">Log in</button>
  <button id="logout" disabled>Log out</button>
  <span id="whoami" class="sys">not logged in</span>
</fieldset>

<fieldset>
  <legend>Connection</legend>
  <button id="connect" disabled>Connect</button>
  <span id="status" class="sys">disconnected</span>
</fieldset>

<fieldset>
  <legend>Send</legend>
  <input id="to" placeholder="to (username)" title="History loads when you leave this field">
  <input id="text" placeholder="message" size="30">
  <button id="send" disabled>Send</button>
</fieldset>

<div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let ws = null;
  let me = null;
  // Message ids already shown. History and live delivery can overlap (a message can arrive
  // over the socket while its history page is loading), so both paths skip ids seen before.
  const shown = new Set();

  function showMessage(m) {
    if (shown.has(m.id)) return;
    shown.add(m.id);
    const who = m.from === me ? `you → ${m.to}` : `${m.from} → you`;
    log(m.from === me ? 'out' : 'in', `#${m.seq} ${who}: ${m.text}`);
  }

  // Same-origin fetches send the HttpOnly session cookie automatically (and Origin on POST, which
  // the server checks). This script never sees the token itself.
  function setLoggedIn(username) {
    me = username;
    $('whoami').textContent = username ? 'logged in as ' + username : 'not logged in';
    $('logout').disabled = !username;
    $('connect').disabled = !username;
  }

  async function auth(path) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('user').value, password: $('password').value }),
    });
    $('password').value = '';
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { log('err', `${path}: ${res.status} ${body.error || ''}`); return; }
    setLoggedIn(body.username);
    log('sys', 'logged in as ' + body.username);
  }
  $('register').onclick = () => auth('/api/auth/register');
  $('login').onclick = () => auth('/api/auth/login');
  $('logout').onclick = async () => {
    // The server also closes this session's sockets (close code 4001).
    await fetch('/api/auth/logout', { method: 'POST' });
    setLoggedIn(null);
    log('sys', 'logged out');
  };

  // Restore the login on page load if the cookie is still valid.
  fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(b => b && setLoggedIn(b.username));

  // Opening a chat: fetch the latest page over REST (port 8080, same origin as this page), so
  // messages sent while we were offline appear.
  async function loadHistory() {
    const to = $('to').value.trim();
    if (!me || !to) return;
    const convs = await (await fetch('/api/conversations')).json();
    const conv = convs.find(c => c.otherUser === to);
    if (!conv) { log('sys', `no history with ${to} yet`); return; }
    const page = await (await fetch(`/api/conversations/${conv.id}/messages?limit=50`)).json();
    log('sys', `— history with ${to} (${page.messages.length} messages${page.nextBeforeSeq ? ', older ones not shown' : ''}) —`);
    page.messages.forEach(showMessage);
  }
  $('to').onchange = loadHistory;

  function log(cls, line) {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = new Date().toLocaleTimeString() + '  ' + line;
    $('log').appendChild(div);
    $('log').scrollTop = $('log').scrollHeight;
  }

  $('connect').onclick = () => {
    if (ws) { ws.close(1000, 'bye'); return; }
    // Same host as the page, WebSocket port 8081 unless the page URL has ?wsPort=... (for a second
    // instance on other ports). No identity in the URL: cookies are scoped by host, not port, so
    // the browser sends the session cookie from :8080 on this upgrade to :8081 as well.
    const wsPort = new URLSearchParams(location.search).get('wsPort') || '8081';
    ws = new WebSocket(`ws://${location.hostname}:${wsPort}/`);
    let opened = false;
    $('status').textContent = 'connecting…';

    ws.onopen = () => {
      opened = true;
      $('status').textContent = 'connected as ' + me;
      $('connect').textContent = 'Disconnect';
      $('send').disabled = false;
      log('sys', 'connected as ' + me);
      loadHistory(); // on reconnect, catch up on the open chat
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'message') {
        // Includes our own messages sent from another tab (from === us).
        showMessage(m);
      } else if (m.type === 'ack') {
        shown.add(m.id); // already shown locally when sent
        log('sys', `ack → id ${m.id}, seq #${m.seq}`);
      } else if (m.type === 'error') {
        log('err', `error ${m.code}: ${m.message}`);
      } else {
        log('sys', 'unknown: ' + e.data);
      }
    };
    ws.onclose = (e) => {
      // Browsers hide the HTTP status of a rejected upgrade (401/403/429): all we get is 1006.
      if (!opened) log('err', 'handshake rejected: not logged in, origin not allowed, or too many connections');
      else log('sys', `closed (code ${e.code}${e.reason ? ', ' + e.reason : ''})`);
      if (e.code === 4001) setLoggedIn(null); // session ended: log in again rather than reconnect
      $('status').textContent = 'disconnected';
      $('connect').textContent = 'Connect';
      $('send').disabled = true;
      ws = null;
    };
  };

  function send() {
    const text = $('text').value;
    const msg = { type: 'send', to: $('to').value.trim(), clientMsgId: crypto.randomUUID(), text };
    ws.send(JSON.stringify(msg));
    log('out', `you → ${msg.to}: ${text}`);
    $('text').value = '';
  }
  $('send').onclick = send;
  $('text').onkeydown = (e) => { if (e.key === 'Enter' && !$('send').disabled) send(); };
</script>
</body>
</html>
